name: Sync Policy to ServiceNow
 
on:
  push:
    paths:
      - 'security-policy.md'

jobs:
  send-to-servicenow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Markdown Converter
        run: sudo apt-get install -y pandoc

      - name: Prepare JSON Payload
        id: build_payload
        run: |
          # 1. Convert Markdown to HTML using GitHub Flavored Markdown (gfm) parser
          RAW_HTML=$(pandoc -f gfm -t html security-policy.md)
          
          # 2. Add an inline <style> block so tables have clean borders inside ServiceNow
          TABLE_STYLE="<style>table { border-collapse: collapse; width: 100%; } th, td { border: 1px solid #dddddd; text-align: left; padding: 8px; } th { background-color: #f2f2f2; }</style>"
          HTML_CONTENT="${TABLE_STYLE}${RAW_HTML}"

          # 3. Fix the GitHub asset URL so images display natively
          HTML_CONTENT=$(echo "$HTML_CONTENT" | sed 's|/blob/main/|/raw/main/|g')
          
          # 4. Define your metadata fields
          POLICY_NUMBER="POL0010217"
          POLICY_NAME="Change Management - yes working"
          
          # 5. Build safe payload using jq
          jq -n \
            --arg num "$POLICY_NUMBER" \
            --arg name "$POLICY_NAME" \
            --arg text "$HTML_CONTENT" \
            '{number: $num, name: $name, policy_text: $text}' > payload.json

      - name: Send API Request to ServiceNow
        run: |
          curl -X POST \
          -H "Content-Type: application/json" \
          -u "github.integration:Policy_Sync_2026" \
          --data-binary @payload.json \
          https://dev391524.service-now.com//api/sn_compliance/test_policy/update
          
