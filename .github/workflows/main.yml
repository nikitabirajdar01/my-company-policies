name: Sync Policy to ServiceNow
 
on:
  push:
    paths:
      - 'security-policy.md'

jobs:
  send-to-servicenow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install markdown python-frontmatter

      - name: Parse Markdown and Build Payload
        id: build_payload
        run: |
          python -c "
          import frontmatter
          import markdown
          import json

          # Load markdown securely
          post = frontmatter.load('security-policy.md')
          policy_number = post.get('Number', '').strip()
          policy_name = post.get('Name', '').strip()

          # Convert tables and core elements cleanly to standard HTML structures
          html_content = markdown.markdown(post.content, extensions=['tables'])

          # Fix the GitHub asset URL so ServiceNow can visually fetch the image file
          html_content = html_content.replace('/blob/main/', '/raw/main/')

          # Format cleanly into a strict JSON payload mapping
          payload = {
              'number': policy_number,
              'name': policy_name,
              'policy_text': html_content
          }

          with open('payload.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          "

      - name: Send API Request to ServiceNow
        run: |
          curl -X POST \
          -H "Content-Type: application/json" \
          -u "github.integration:Policy_Sync_2026" \
          --data-binary @payload.json \
          https://dev391524.service-now.com//api/sn_compliance/test_policy/update
