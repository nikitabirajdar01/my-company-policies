name: Sync Policy to ServiceNow
 
on:
  push:
    paths:
      - 'security-policy.md'

jobs:
  send-to-servicenow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Markdown Converter
        run: sudo apt-get install -y pandoc

      - name: Prepare JSON Payload
        id: build_payload
        run: |
          # 1. Strip front matter cleanly so it does not break formatting
          sed '1,/\-\-\-/d;/\-\-\-/d' security-policy.md > pure-policy.md

          # 2. Convert pure markdown to HTML using GitHub Flavored Markdown (gfm)
          RAW_HTML=$(pandoc -f gfm -t html pure-policy.md)
          
          # 3. Add explicit styles for tables and cap the max width of images to 100%
          TABLE_STYLE="<style>table { border-collapse: collapse; width: 100%; margin: 16px 0; font-family: sans-serif; } th, td { border: 1px solid #cccccc; text-align: left; padding: 10px; } th { background-color: #f5f5f5; font-weight: bold; } img { max-width: 100%; height: auto; display: block; margin: 15px 0; }</style>"
          HTML_CONTENT="${TABLE_STYLE}${RAW_HTML}"

          # 4. Correct the public image URL from /blob/ view to /raw/ engine delivery
          HTML_CONTENT=$(echo "$HTML_CONTENT" | sed 's|/blob/main/|/raw/main/|g')
          
          # 5. Establish metadata values 
          POLICY_NUMBER="POL0010217"
          POLICY_NAME="Change Management - yes working"
          
          # 6. Safely wrap everything into payload.json with jq to escape quotes and newlines
          jq -n \
            --arg num "$POLICY_NUMBER" \
            --arg name "$POLICY_NAME" \
            --arg text "$HTML_CONTENT" \
            '{number: $num, name: $name, policy_text: $text}' > payload.json

      - name: Send API Request to ServiceNow
        run: |
          curl -X POST \
          -H "Content-Type: application/json" \
          -u "github.integration:Policy_Sync_2026" \
          --data-binary @payload.json \
          https://dev391524.service-now.com//api/sn_compliance/test_policy/update

          
          
          
