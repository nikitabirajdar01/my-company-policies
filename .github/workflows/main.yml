name: Sync Policy to ServiceNow
 
on:
  push:
    paths:
      - 'security-policy.md'

jobs:
  send-to-servicenow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Compilers
        run: pip install markdown python-frontmatter

      - name: Compile Document and Dynamically Parse Fields
        id: parse_data
        run: |
          python -c "
          import frontmatter
          import markdown
          import json

          # 1. Parse front matter cleanly (Separates metadata from document content)
          post = frontmatter.load('security-policy.md')
          
          # 2. Dynamically pull properties directly out of the markdown file header
          policy_number = post.get('Number', '').strip()
          policy_name = post.get('Name', '').strip()

          # Fallbacks if fields are missing in front-matter
          if not policy_number: policy_number = 'POL0010217'
          if not policy_name: policy_name = 'Change Management'

          # 3. Convert markdown content to structured HTML tables natively
          html_content = markdown.markdown(post.content, extensions=['tables'])

          # 4. Inject explicit CSS rules for clear visible table structures and auto-sized images
          inline_styles = (
              '<style>'
              'table { border-collapse: collapse; width: 100%; margin: 16px 0; font-family: sans-serif; } '
              'th, td { border: 1px solid #cccccc; text-align: left; padding: 10px; } '
              'th { background-color: #f5f5f5; font-weight: bold; } '
              'img { max-width: 100%; height: auto; display: block; margin: 15px 0; }'
              '</style>'
              )
          final_html = inline_styles + html_content

          # 5. Correct the public image URL from /blob/ view to /raw/ engine delivery
          final_html = final_html.replace('/blob/main/', '/raw/main/')

          # 6. Build the dynamic outbound JSON structure
          payload = {
              'number': policy_number,
              'name': policy_name,
              'policy_text': final_html
          }

          with open('payload.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          "

      - name: Send API Request to ServiceNow
        run: |
          curl -X POST \
          -H "Content-Type: application/json" \
          -u "github.integration:Policy_Sync_2026" \
          --data-binary @payload.json \
          https://dev391524.service-now.com//api/sn_compliance/test_policy/update

          

          
          
          
